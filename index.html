                <a-ring id="vr-headset-overlay" position="0 0 -0.3" radius-inner="0.32" radius-outer="0.8"

                </a-ring>

                                <a-image id="hudp" src="#hudP" position="0 0 -1.-0.296" width="1.2" height="0.5" visible="false" transparent="true" material="transparent: true; alphaTest: 0.5" scale="4 3.5 1.03"></a-image>

                    <a-sphere radius="2" color="black" material="shader: flat; side: back" position="0 0 0"></a-sphere>

                        font="https://cdn.aframe.io/fonts/Exo2Bold.fnt" color="#d4af37"></a-text>

                    <a-text value="READY PLAYER ONE x GUCCI" position="0 0.08 0" align="center" width="0.8"

                    <a-plane id="vr-loading-bar" position="-0.3 -0.05 0.001" width="0.6" height="0.015" color="#d4af37"
                        pivot="0.3 0 0" scale="0 1 1" shader="flat"></a-plane>

                    <a-text id="vr-loading-text" value="INITIALIZATION..." position="0 -0.15 0" align="center"
                        width="0.8" color="#aaa"></a-text>

                </a-entity>



            </a-camera>

        <!-- Script: apply VR color palette and VR sky gradient when VR world is activated -->
        <script>
            (function(){
                const palette = { gold: '#E8C449', teal: '#276761', ivory: '#FFFDFF' };
                const remap = {
                    '#228B22': palette.teal,
                    '#2E8B57': palette.teal,
                    '#32CD32': palette.teal,
                    '#006400': palette.teal,
                    '#87CEEB': palette.ivory,
                    '#ADD8E6': palette.ivory,
                    '#B0E0E6': palette.ivory,
                    '#D2B48C': palette.gold,
                    '#C4A67C': palette.gold,
                    '#F5F5DC': palette.gold,
                    '#FAF0E6': palette.gold,
                    '#FFFAF0': palette.gold,
                    '#FFF8DC': palette.gold
                };

                function applyVrPalette(){
                    const root = document.getElementById('vr-world');
                    if(!root) return;
                    root.querySelectorAll('[color]').forEach(el=>{
                        const c = el.getAttribute('color');
                        if(c && remap[c]) el.setAttribute('color', remap[c]);
                    });
                    root.querySelectorAll('[material]').forEach(el=>{
                        const mat = el.getAttribute('material');
                        if(!mat || typeof mat !== 'string') return;
                        const m = mat.match(/color:\s*(#[0-9a-fA-F]{3,6})/);
                        if(m && remap[m[1]]){
                            const newMat = mat.replace(m[1], remap[m[1]]);
                            el.setAttribute('material', newMat);
                        }
                    });
                    root.querySelectorAll('[light]').forEach(el=>{
                        const light = el.getAttribute('light');
                        if(!light || typeof light !== 'string') return;
                        const g = light.match(/groundColor:\s*(#[0-9a-fA-F]{3,6})/);
                        if(g && remap[g[1]]){
                            const newLight = light.replace(g[1], remap[g[1]]);
                            el.setAttribute('light', newLight);
                        }
                    });
                }

                // Draw gradient onto the canvas used by the VR sky
                function createVrSkyTexture(){
                    const canvas = document.getElementById('vrSkyCanvas');
                    if(!canvas) return;
                    const ctx = canvas.getContext('2d');
                    const w = canvas.width; const h = canvas.height;
                    // vertical gradient: top green -> bottom yellow
                    const g = ctx.createLinearGradient(0,0,0,h);
                    g.addColorStop(0, palette.teal); // top
                    g.addColorStop(1, palette.gold); // horizon
                    ctx.fillStyle = g;
                    ctx.fillRect(0,0,w,h);
                    // subtle radial vignette for depth
                    const rg = ctx.createRadialGradient(w/2, h/3, h/8, w/2, h/2, h);
                    rg.addColorStop(0, 'rgba(255,255,255,0)');
                    rg.addColorStop(1, 'rgba(0,0,0,0.12)');
                    ctx.fillStyle = rg;
                    ctx.fillRect(0,0,w,h);
                }

                // show/hide VR sky and apply palette when vr-world toggles
                function handleVrVisibility(isVisible){
                    const root = document.getElementById('vr-world');
                    const sky = document.getElementById('vr-sky');
                    if(isVisible){
                        applyVrPalette();
                        createVrSkyTexture();
                        if(sky) sky.setAttribute('visible', true);
                    } else {
                        if(sky) sky.setAttribute('visible', false);
                    }
                }

                // expose a test function to programmatically remove the headset
                window.testRemoveHeadset = function(){
                    try{
                        const el = document.getElementById('oasis-headset');
                        if(!el) return { ok:false, reason:'oasis-headset not found' };
                        const comp = el.components && el.components['headset-toggle'];
                        if(!comp || typeof comp.removeHeadset !== 'function') return { ok:false, reason:'removeHeadset not available' };
                        comp.removeHeadset();
                        return { ok:true };
                    }catch(err){
                        return { ok:false, reason: err.message };
                    }
                };

                const vr = document.getElementById('vr-world');
                if(vr){
                    const obs = new MutationObserver(muts=>{
                        muts.forEach(m=>{
                            if(m.attributeName === 'visible'){
                                const v = vr.getAttribute('visible');
                                const isVisible = (v === 'true' || v === '' || v === true);
                                handleVrVisibility(isVisible);
                            }
                        });
                    });
                    obs.observe(vr, { attributes: true });
                    const v0 = vr.getAttribute('visible');
                    const initiallyVisible = (v0 === 'true' || v0 === '' || v0 === true);
                    if(initiallyVisible) handleVrVisibility(true);
                }
            })();
        </script>
